# Publishes each version tag to npm. npm trusts this workflow (`npmjs publish` set that up),
# so there's no token; the version comes from the tag, which `github release` pushes.
name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- task setup
      - run: devbox run -- task check
      - name: Publish the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: devbox run --quiet -- task publish VERSION="${TAG#v}"
